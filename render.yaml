services:
  # Combined Bot + Dashboard Service
  - type: web
    name: the-z
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      # سر توقيع روابط التحميل التي يرسلها الأمر ,dw (نفس القيمة للبوت واللوحة تلقائيًا)
      - key: DOWNLOADER_SECRET
        generateValue: true
      # اتركه فارغًا هنا وحدّده في Render بمتغير NEXTAUTH_URL = رابط الخدمة العام.
      # إن لم يُضبط، يستخدم start.js قيمة RENDER_EXTERNAL_URL تلقائيًا.
      - key: NEXTAUTH_URL
        sync: false
      # اختياري: معرّف مالك لوحة التحكم (بدونه يُستخدم المعرّف الافتراضي في الكود)
      - key: OWNER_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
        # اختياري — مثال: redis://... من Render Redis أو Upstash.
        # عند غيابه: البوت يستمر على ذاكرة العملية (fallback) للبيانات المؤقتة فقط.
      - key: DB_SSL_CA_PATH
        value: /app/certs/root.crt
    disk:
      name: certs
      mountPath: /app/certs
      sizeGB: 1
