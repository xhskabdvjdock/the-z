services:
  # Dashboard Service
  - type: web
    name: the-z-dashboard
    env: docker
    dockerfilePath: ./dashboard/Dockerfile
    dockerContext: ./dashboard
    envVars:
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://the-z-whib.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_CA_PATH
        value: /app/certs/root.crt
    healthCheckPath: /health
    disk:
      name: certs
      mountPath: /app/certs
      sizeGB: 1

  # Bot Service
  - type: worker
    name: the-z-bot
    env: docker
    dockerfilePath: ./bot/Dockerfile
    dockerContext: ./bot
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_CA_PATH
        value: /app/certs/root.crt
    disk:
      name: certs
      mountPath: /app/certs
      sizeGB: 1
