services:
  # Combined Bot + Dashboard Service
  - type: web
    name: the-z
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://the-z-8c94.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
        # اختياري — مثال: redis://... من Render Redis أو Upstash.
        # عند غيابه: البوت يستمر على ذاكرة العملية (fallback) للبيانات المؤقتة فقط.
      - key: DB_SSL_CA_PATH
        value: /app/certs/root.crt
    disk:
      name: certs
      mountPath: /app/certs
      sizeGB: 1
