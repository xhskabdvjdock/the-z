services:
  # Dashboard Web Service
  - type: web
    name: the-z-dashboard
    env: docker
    dockerfilePath: ./dashboard/Dockerfile
    dockerContext: .
    envVars:
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://the-z-whib.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_CA_PATH
        value: /app/certs/root.crt
    healthCheckPath: /health
    disk:
      name: certs-dashboard
      mountPath: /app/certs
      sizeGB: 1

  # Bot Background Worker
  - type: worker
    name: the-z-bot
    env: docker
    dockerfilePath: ./bot/Dockerfile
    dockerContext: .
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_CA_PATH
        value: /app/certs/root.crt
      - key: DASHBOARD_URL
        value: https://the-z-whib.onrender.com
    disk:
      name: certs-bot
      mountPath: /app/certs
      sizeGB: 1
