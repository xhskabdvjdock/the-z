version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: the-z-redis
    restart: unless-stopped
    # بدون فتح أي منفذ للعامة — يخدم فقط داخل شبكة the-z-network (العزل الأمني)
    expose:
      - "6379"
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    networks:
      - the-z-network

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
      target: builder
    container_name: the-z-bot
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    env_file:
      - .env
    volumes:
      - ./bot/certs:/app/certs
    networks:
      - the-z-network

  deploy-commands:
    build:
      context: .
      dockerfile: bot/Dockerfile
      target: deploy
    container_name: the-z-deploy
    env_file:
      - .env
    profiles:
      - deploy

  clear-commands:
    build:
      context: .
      dockerfile: bot/Dockerfile
      target: clear
    container_name: the-z-clear
    env_file:
      - .env
    profiles:
      - clear

networks:
  the-z-network:
    driver: bridge
